uniform.vec2.screenSize = vec2(viewWidth, viewHeight)
uniform.vec2.texelSize = vec2(1.0 / viewWidth, 1.0 / viewHeight)

variable.float.hasWeather = if(rainfall > 0.01, 1.0, 0.0)
variable.float.hasWeatherSmooth = smooth(1, hasWeather, 50.0, 50.0)
variable.float.hasRainSmooth = smooth(2, if(temperature > 0.15, 1.0, 0.0) * hasWeather, 50.0, 50.0)
uniform.float.weatherStrength = wetness * hasWeatherSmooth
uniform.float.rainyStrength = wetness * hasRainSmooth

variable.int.frameIndex = frameCounter % 16
variable.float.jitterX = frac(0.5 + frameIndex * 0.7548776269)
variable.float.jitterY = frac(0.5 + frameIndex * 0.5698402524)
uniform.vec2.taaOffset = vec2((jitterX * 2.0 - 1.0) / viewWidth, (jitterY * 2.0 - 1.0) / viewHeight)
uniform.vec2.taaOffsetVX = vec2((jitterX * 2.0 - 1.0) / viewWidth, (jitterY * 2.0 - 1.0) / viewHeight)
variable.int.prevFrameIndex = (frameCounter - 1) % 16
variable.float.prevJitterX = frac(0.5 + prevFrameIndex * 0.7548776269)
variable.float.prevJitterY = frac(0.5 + prevFrameIndex * 0.5698402524)
uniform.vec2.prevTaaOffset = vec2((prevJitterX - 0.5) / viewWidth, (prevJitterY - 0.5) / viewHeight)

uniform.vec3.cameraMovement = vec3(cameraPosition.x - previousCameraPosition.x, cameraPosition.y - previousCameraPosition.y, cameraPosition.z - previousCameraPosition.z)

variable.float.lightAngle = if(sunAngle < 0.5, 1.0, -1.0)
uniform.vec3.shadowDirection = vec3(shadowModelViewInverse.2.0, shadowModelViewInverse.2.1, shadowModelViewInverse.2.2)
uniform.vec3.sunDirection = vec3(shadowModelViewInverse.2.0 * lightAngle, shadowModelViewInverse.2.1 * lightAngle, shadowModelViewInverse.2.2 * lightAngle)

uniform.vec3.shadowModelViewProj0 = \
    vec3( \
        shadowModelView.0.0 * shadowProjection.0.0 + shadowModelView.0.1 * shadowProjection.1.0 + shadowModelView.0.2 * shadowProjection.2.0, \
        shadowModelView.0.0 * shadowProjection.0.1 + shadowModelView.0.1 * shadowProjection.1.1 + shadowModelView.0.2 * shadowProjection.2.1, \
        shadowModelView.0.0 * shadowProjection.0.2 + shadowModelView.0.1 * shadowProjection.1.2 + shadowModelView.0.2 * shadowProjection.2.2  \
    )
uniform.vec3.shadowModelViewProj1 = \
    vec3( \
        shadowModelView.1.0 * shadowProjection.0.0 + shadowModelView.1.1 * shadowProjection.1.0 + shadowModelView.1.2 * shadowProjection.2.0, \
        shadowModelView.1.0 * shadowProjection.0.1 + shadowModelView.1.1 * shadowProjection.1.1 + shadowModelView.1.2 * shadowProjection.2.1, \
        shadowModelView.1.0 * shadowProjection.0.2 + shadowModelView.1.1 * shadowProjection.1.2 + shadowModelView.1.2 * shadowProjection.2.2  \
    )
uniform.vec3.shadowModelViewProj2 = \
    vec3( \
        shadowModelView.2.0 * shadowProjection.0.0 + shadowModelView.2.1 * shadowProjection.1.0 + shadowModelView.2.2 * shadowProjection.2.0, \
        shadowModelView.2.0 * shadowProjection.0.1 + shadowModelView.2.1 * shadowProjection.1.1 + shadowModelView.2.2 * shadowProjection.2.1, \
        shadowModelView.2.0 * shadowProjection.0.2 + shadowModelView.2.1 * shadowProjection.1.2 + shadowModelView.2.2 * shadowProjection.2.2  \
    )
uniform.vec3.shadowModelViewProj3 = \
    vec3( \
        shadowModelView.3.0 * shadowProjection.0.0 + shadowModelView.3.1 * shadowProjection.1.0 + shadowModelView.3.2 * shadowProjection.2.0 + shadowModelView.3.3 * shadowProjection.3.0, \
        shadowModelView.3.0 * shadowProjection.0.1 + shadowModelView.3.1 * shadowProjection.1.1 + shadowModelView.3.2 * shadowProjection.2.1 + shadowModelView.3.3 * shadowProjection.3.1, \
        shadowModelView.3.0 * shadowProjection.0.2 + shadowModelView.3.1 * shadowProjection.1.2 + shadowModelView.3.2 * shadowProjection.2.2 + shadowModelView.3.3 * shadowProjection.3.2  \
    )

variable.float.viewShadowDirectionX = shadowModelViewInverse.2.0 * gbufferModelView.0.0 + shadowModelViewInverse.2.1 * gbufferModelView.1.0 + shadowModelViewInverse.2.2 * gbufferModelView.2.0
variable.float.viewShadowDirectionY = shadowModelViewInverse.2.0 * gbufferModelView.0.1 + shadowModelViewInverse.2.1 * gbufferModelView.1.1 + shadowModelViewInverse.2.2 * gbufferModelView.2.1
variable.float.viewShadowDirectionZ = shadowModelViewInverse.2.0 * gbufferModelView.0.2 + shadowModelViewInverse.2.1 * gbufferModelView.1.2 + shadowModelViewInverse.2.2 * gbufferModelView.2.2
uniform.vec3.viewShadowDirection = vec3(viewShadowDirectionX, viewShadowDirectionY, viewShadowDirectionZ)

variable.float.groundRayleighAbsorption = 246818.1204632377 / (27.3786090825 * shadowModelViewInverse.2.1 + 1.0)
variable.float.groundMieAbsorption = 2.7853950253 / (72.8668877703 * shadowModelViewInverse.2.1 + 1.0)
variable.float.sunsetClamp = clamp(shadowModelViewInverse.2.1 * 30.0, 0.0, 1.0)
uniform.vec3.sunlightColor = vec3( \
    sunsetClamp * exp(-groundRayleighAbsorption * 0.0000073 - groundMieAbsorption), \
    sunsetClamp * exp(-groundRayleighAbsorption * 0.0000171 - groundMieAbsorption), \
    sunsetClamp * exp(-groundRayleighAbsorption * 0.0000298 - groundMieAbsorption) \
)

variable.float.abzaFogDay = clamp(sin(sunAngle * 6.2831853) * 2.0 + 0.5, 0.0, 1.0)
variable.float.abzaFogRain = 1.0 - rainStrength * 0.5
uniform.vec3.abzaFogDivisor = vec3( \
    (0.94 * abzaFogDay + 0.06) * abzaFogRain, \
    (0.94 * abzaFogDay + 0.06) * abzaFogRain, \
    (0.91 * abzaFogDay + 0.09) * (1.0 - rainStrength * 0.4) \
)
variable.float.abzaRainfall = smooth(3, rainfall, 10.0, 10.0)
uniform.float.abzaHumidity = abzaRainfall

uniform.float.rainyMieBeta = 0.000021 * (1.0 + 10.0 * weatherStrength * exp(-cameraPosition.y / 2000.0))
